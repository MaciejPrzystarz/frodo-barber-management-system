<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Barbera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap"
          rel="stylesheet">
</head>
<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<h3>Moje wizyty:</h3>
<div class="dashboard-card">
    <table th:if="${!#lists.isEmpty(appointments)}">
        <thead>
        <tr>
            <th>Data</th>
            <th>Barber</th>
            <th>Numer telefonu</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="appointment : ${appointments}">
            <td th:text="${#temporals.format(appointment.startTime, 'yyyy-MM-dd (HH:mm)')}"></td>
            <td th:text="${appointment.client.fullName}"></td>
            <td th:text="${appointment.client.phoneNumber}"></td>
        </tr>
        </tbody>
    </table>
</div>

<a th:href="@{/}">Strona główna</a>

<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
