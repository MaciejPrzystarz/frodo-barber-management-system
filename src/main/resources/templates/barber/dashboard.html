<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
    <title>Panel Barbera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>
<div th:if="${successMessage}" class="alert alert-success text-center">
    <span th:text="${successMessage}"></span>
</div>

<div th:if="${errorMessage}" class="alert alert-danger text-center">
    <span th:text="${errorMessage}"></span>
</div>
<div class="container-fluid my-5 dashboard-wide">
    <div class="row g-4 align-items-stretch">

        <div class="dashboard-card">
            <h3 style="text-align: center">Moje wizyty</h3>
            <table class="table table-dark table-responsive" th:if="${!#lists.isEmpty(appointments)}">
                <thead>
                <tr>
                    <th>Dzień</th>
                    <th>Godzina</th>
                    <th>Klient</th>
                    <th>Numer telefonu</th>
                    <th>Usługa</th>
                    <th>Koszt</th>
                    <th>Czas</th>
                    <th>Status</th>
                    <th>Zrealizowana</th>
                    <th>Odwołana</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appointment : ${appointments}">
                    <td th:text="${#temporals.format(appointment.startTime, 'dd.MM')}"></td>
                    <td th:text="${#temporals.format(appointment.startTime, 'HH:mm')}"></td>
                    <td th:text="${appointment.client.fullName}"></td>
                    <td th:text="'+48 ' + ${appointment.client.phoneNumber}"></td>
                    <td th:text="${appointment.service.name}"></td>
                    <td th:text="${appointment.service.price} + 'zł'"></td>
                    <td th:text="${appointment.service.durationMinutes + 'min'}"></td>
                    <td th:text="${appointment.status}"></td>
                    <td>
                        <form method="post" th:action="@{/barber/appointments/{id}/{status}(id=${appointment.id}, status='DONE')}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-success btn-ghost"
                                    th:disabled="${appointment.status.name() == 'DONE'}">DONE</button>
                        </form>
                    </td>
                    <td>
                        <form method="post" th:action="@{/barber/appointments/{id}/{status}(id=${appointment.id}, status='CANCELLED')}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-success btn-ghost"
                                    th:disabled="${appointment.status.name() == 'CANCELLED'}">CANCEL</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="text-center mt-4">
    <a class="btn btn-outline-light" th:href="@{/}">Strona główna</a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
