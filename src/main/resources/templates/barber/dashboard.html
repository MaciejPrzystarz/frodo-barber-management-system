<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Barbera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap"
          rel="stylesheet">
</head>
<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<div class="container-fluid my-5 dashboard-wide">
    <div class="row g-4 align-items-stretch">
        <h3>Moje wizyty</h3>
        <div class="dashboard-card">
            <table class="table table-dark table-responsive" th:if="${!#lists.isEmpty(appointments)}">
                <thead>
                <tr>
                    <th>Data</th>
                    <th>Klient</th>
                    <th>Numer telefonu</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appointment : ${appointments}">
                    <td th:text="${#temporals.format(appointment.startTime, '(dd.MM) - HH:mm')}"></td>
                    <td th:text="${appointment.client.fullName}"></td>
                    <td th:text="'+48 ' + ${appointment.client.phoneNumber}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="text-center mt-4">
    <a class="btn btn-outline-light" th:href="@{/}">Strona główna</a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
