<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
    <title>Panel Barbera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap"
          rel="stylesheet">
</head>
<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>
<div th:if="${successMessage}" class="alert alert-success text-center">
    <span th:text="${successMessage}"></span>
</div>

<div th:if="${errorMessage}" class="alert alert-danger text-center">
    <span th:text="${errorMessage}"></span>
</div>

<div class="container mt-4">
    <div class="dashboard-card p-4">
        <div class="row g-3 text-center">

            <div class="col-12 col-md-6 col-xl-3">
                <a th:href="@{/barber/add-appointment}" class="barber-tile-btn">
                    <i class="fa-solid fa-plus"></i>
                    <span>Dodaj wizytę</span>
                </a>
            </div>

            <div class="col-12 col-md-6 col-xl-3">
                <a th:href="@{/barber/my-week}" class="barber-tile-btn">
                    <i class="fa-solid fa-calendar-week"></i>
                    <span>Mój tydzień</span>
                </a>
            </div>

            <div class="col-12 col-md-6 col-xl-3">
                <a th:href="@{/barber/pending-appointments}" class="barber-tile-btn">
                    <i class="fa-solid fa-clock"></i>
                    <span>Oczekujące wizyty</span>
                </a>
            </div>

            <div class="col-12 col-md-6 col-xl-3">
                <a th:href="@{/barber/vacation}" class="barber-tile-btn">
                    <i class="fa-solid fa-umbrella-beach"></i>
                    <span>Urlop</span>
                </a>
            </div>

        </div>
    </div>
</div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-xl-12 col-lg-11 col-md-12">
            <div class="dashboard-card text-center mx-auto">
                <div class="d-flex align-items-center mb-4 position-relative">
                    <h1 class="position-absolute start-50 translate-middle-x mb-0"
                        th:text="|${#temporals.format(selectedDate, 'dd.MM')} - ${#temporals.dayOfWeekName(selectedDate)}|"></h1>
                    <div class="ms-auto">
                        <form method="get" th:action="@{/barber/dashboard}"
                              class="d-flex align-items-center gap-1 flex-wrap">
                            <div class="booking-field">
                                <input id="date" class="form-control booking-control" type="date" name="date"
                                       th:value="${selectedDate != null ? #temporals.format(selectedDate, 'yyyy-MM-dd') : ''}">
                                <button type="submit" class="btn btn-gold">Pokaż</button>
                                <a th:href="@{/barber/dashboard}" class="btn btn-gold">Dziś</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="alert booking-alert text-center" th:if="${#lists.isEmpty(appointments)}">
                Nie ma żadnej wizyty umówionej na ten dzień.
            </div>

            <table class="table table-dark table-sm text-center align-middle" th:if="${!#lists.isEmpty(appointments)}">
                <thead>
                <tr>
                    <th>Od</th>
                    <th>Do</th>
                    <th>Klient</th>
                    <th>Numer telefonu</th>
                    <th>Usługa</th>
                    <th>Koszt</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appointment : ${appointments}">
                    <td th:text="${#temporals.format(appointment.startTime, 'HH:mm')}"></td>
                    <td th:text="${#temporals.format(appointment.endTime, 'HH:mm')}"></td>
                    <td th:text="${appointment.customer != null ? appointment.customer.fullName :
                    appointment.client.fullName}"></td>
                    <td th:text="'+48 ' + ${appointment.customer != null ? appointment.customer.phoneNumber :
                    appointment.client.phoneNumber}"></td>
                    <td th:text="${appointment.service.name}"></td>
                    <td th:text="${appointment.service.price} + 'zł'"></td>
                    <td>
                        <div class="booking-field">
                            <form th:action="@{'/barber/appointments/' + ${appointment.id}}" method="post"
                                  class="d-flex align-items-center gap-2">
                                <select class="form-select booking-control text-center fw-bold"
                                        name="status" required style="max-width: 240px">
                                    <option th:each="status : ${appointmentStatuses}"
                                            th:value="${status}"
                                            th:selected="${status == appointment.status}"
                                            th:text="${status.plTranslation}">
                                    </option>
                                </select>
                                <button type="submit" class="btn btn-gold">Zapisz</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="text-center mt-4">
    <a class="btn btn-outline-light" th:href="@{/}">Strona główna</a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
