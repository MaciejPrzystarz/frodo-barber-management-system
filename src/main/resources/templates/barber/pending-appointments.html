<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
    <title>Panel Barbera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap"
          rel="stylesheet">
</head>
<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>
<div th:if="${successMessage}" class="alert alert-success text-center">
    <span th:text="${successMessage}"></span>
</div>

<div th:if="${errorMessage}" class="alert alert-danger text-center">
    <span th:text="${errorMessage}"></span>
</div>


<div class="container-fluid my-5 dashboard-wide">
    <div class="row g-8 align-items-stretch">

        <div class="col-xl-8 col-lg-4 col-md-4">
            <div class="dashboard-card">
                <h4 style="text-align: center">Lista użytkowników oczekujących na potwierdzenie</h4>
                <table class="table table-dark table-responsive" th:if="${!#lists.isEmpty(pendingAppointments)}">
                    <thead>
                    <tr>
                        <th>Imię Nazwisko</th>
                        <th>Email</th>
                        <th>Numer telefonu</th>
                        <th>Usługa</th>
                        <th>Data</th>
                        <th>Od</th>
                        <th>Do</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="appointment : ${pendingAppointments}">
                        <td th:text="${appointment.client.fullName}"></td>
                        <td th:text="${appointment.client.email}"></td>
                        <td th:text="${appointment.client.phoneNumber}"></td>
                        <td th:text="${appointment.service.name}"></td>
                        <td th:text="${#temporals.format(appointment.startTime, 'dd.MM')}"></td>
                        <td th:text="${#temporals.format(appointment.startTime, 'HH:mm')}"></td>
                        <td th:text="${#temporals.format(appointment.endTime, 'HH:mm')}"></td>
                        <td>
                            <div class="booking-field">
                                <form th:action="@{'/barber/appointments/' + ${appointment.id}}" method="post"
                                      class="d-flex align-items-center gap-2">
                                    <select class="form-select booking-control text-center fw-bold"
                                            name="status" required style="max-width: 180px;">
                                        <option th:each="status : ${appointmentStatuses}"
                                                th:value="${status}"
                                                th:selected="${status == appointment.status}"
                                                th:text="${status.plTranslation}">
                                        </option>
                                    </select>
                                    <button type="submit" class="btn btn-gold">Zapisz</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<div class="text-center mt-4">
    <a class="btn btn-outline-light" th:href="@{/}">Strona główna</a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
