<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Wizyty oczekujące – Frodo Barber')}"></head>
<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>


<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-xl-12 col-lg-11 col-md-12">

            <div class="dashboard-card text-center mx-auto">
                <h3 class="p-4">Lista użytkowników oczekujących na potwierdzenie</h3>

                <div class="alert booking-alert text-center mx-3" th:if="${#lists.isEmpty(pendingAppointments)}">
                    Brak wizyt oczekujących na potwierdzenie.
                </div>

                <div class="table-responsive d-none d-md-block" th:if="${!#lists.isEmpty(pendingAppointments)}">
                    <table class="table table-dark table-sm text-center align-middle">
                        <thead>
                        <tr>
                            <th>Imię Nazwisko</th>
                            <th>E-mail</th>
                            <th>Numer telefonu</th>
                            <th>Usługa</th>
                            <th>Data</th>
                            <th>Od</th>
                            <th>Do</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="appointment : ${pendingAppointments}">
                            <td th:text="${appointment.client.fullName}"></td>
                            <td th:text="${appointment.client.email}"></td>
                            <td th:text="|+48 ${appointment.client.phoneNumber}|"></td>
                            <td th:text="${appointment.service.name}"></td>
                            <td th:text="${#temporals.format(appointment.startTime, 'dd.MM')}"></td>
                            <td th:text="${#temporals.format(appointment.startTime, 'HH:mm')}"></td>
                            <td th:text="${#temporals.format(appointment.endTime, 'HH:mm')}"></td>
                            <td>
                                <div class="booking-field">
                                    <form th:action="@{'/barber/appointments/' + ${appointment.id}}" method="post"
                                          class="d-flex align-items-center gap-2">
                                        <select class="form-select booking-control text-center fw-bold"
                                                name="status" required style="max-width: 240px;">
                                            <option th:each="status : ${appointmentStatuses}"
                                                    th:value="${status}"
                                                    th:selected="${status == appointment.status}"
                                                    th:text="${status.plTranslation}">
                                            </option>
                                        </select>
                                        <button type="submit" class="btn btn-gold">Zapisz</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="appointment-cards d-md-none" th:if="${!#lists.isEmpty(pendingAppointments)}">
                    <article class="appointment-card" th:each="appointment : ${pendingAppointments}">
                        <div class="appointment-card-time">
                            <span th:text="${#temporals.format(appointment.startTime, 'dd.MM')}"></span>
                            <span> • </span>
                            <span th:text="${#temporals.format(appointment.startTime, 'HH:mm')}"></span>
                            <span> – </span>
                            <span th:text="${#temporals.format(appointment.endTime, 'HH:mm')}"></span>
                        </div>
                        <div class="appointment-card-row">
                            <span class="appointment-card-label">Klient</span>
                            <span th:text="${appointment.client.fullName}"></span>
                        </div>
                        <div class="appointment-card-row">
                            <span class="appointment-card-label">E-mail</span>
                            <span th:text="${appointment.client.email}"></span>
                        </div>
                        <div class="appointment-card-row">
                            <span class="appointment-card-label">Telefon</span>
                            <span th:text="|+48 ${appointment.client.phoneNumber}|"></span>
                        </div>
                        <div class="appointment-card-row">
                            <span class="appointment-card-label">Usługa</span>
                            <span th:text="${appointment.service.name}"></span>
                        </div>
                        <form th:action="@{'/barber/appointments/' + ${appointment.id}}" method="post"
                              class="appointment-card-form">
                            <select class="form-select booking-control text-center fw-bold" name="status" required>
                                <option th:each="status : ${appointmentStatuses}"
                                        th:value="${status}"
                                        th:selected="${status == appointment.status}"
                                        th:text="${status.plTranslation}">
                                </option>
                            </select>
                            <button type="submit" class="btn btn-gold">Zapisz</button>
                        </form>
                    </article>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
