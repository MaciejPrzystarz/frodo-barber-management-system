<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Wizyty oczekujące – Frodo Barber')}"></head>
<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>
<div th:if="${successMessage}" class="alert alert-success text-center">
    <span th:text="${successMessage}"></span>
</div>

<div th:if="${errorMessage}" class="alert alert-danger text-center">
    <span th:text="${errorMessage}"></span>
</div>


<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-xl-12 col-lg-11 col-md-12">

            <div class="dashboard-card text-center mx-auto">
                <h3 class="p-4">Lista użytkowników oczekujących na potwierdzenie</h3>
                <div class="d-flex align-items-center mb-4 position-relative">
                    <table class="table table-dark table-sm text-center align-middle"
                           th:if="${!#lists.isEmpty(pendingAppointments)}">
                        <thead>
                        <tr>
                            <th>Imię Nazwisko</th>
                            <th>E-mail</th>
                            <th>Numer telefonu</th>
                            <th>Usługa</th>
                            <th>Data</th>
                            <th>Od</th>
                            <th>Do</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="appointment : ${pendingAppointments}">
                            <td th:text="${appointment.client.fullName}"></td>
                            <td th:text="${appointment.client.email}"></td>
                            <td th:text="|+48 ${appointment.client.phoneNumber}|"></td>
                            <td th:text="${appointment.service.name}"></td>
                            <td th:text="${#temporals.format(appointment.startTime, 'dd.MM')}"></td>
                            <td th:text="${#temporals.format(appointment.startTime, 'HH:mm')}"></td>
                            <td th:text="${#temporals.format(appointment.endTime, 'HH:mm')}"></td>
                            <td>
                                <div class="booking-field">
                                    <form th:action="@{'/barber/appointments/' + ${appointment.id}}" method="post"
                                          class="d-flex align-items-center gap-2">
                                        <select class="form-select booking-control text-center fw-bold"
                                                name="status" required style="max-width: 240px;">
                                            <option th:each="status : ${appointmentStatuses}"
                                                    th:value="${status}"
                                                    th:selected="${status == appointment.status}"
                                                    th:text="${status.plTranslation}">
                                            </option>
                                        </select>
                                        <button type="submit" class="btn btn-gold">Zapisz</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
