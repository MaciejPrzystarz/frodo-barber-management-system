<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
    <title>Panel Klienta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap"
          rel="stylesheet">
</head>
<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<div th:if="${errorMessage}" class="alert alert-danger text-center">
    <span th:text="${errorMessage}"></span>
</div>

<div class="container-fluid my-5 dashboard-wide">
    <div class="row g-4 align-items-stretch">
        <h3 style="text-align: center">Moje wizyty</h3>
        <div class="dashboard-card">
            <span th:if="${#lists.isEmpty(appointments)}">Nie masz jeszcze żadnej umówionej wizyty.</span>
            <table class="table table-dark table-responsive" th:if="${!#lists.isEmpty(appointments)}">
                <thead>
                <tr>
                    <th>Data</th>
                    <th>Godzina</th>
                    <th>Usługa</th>
                    <th>Koszt</th>
                    <th>Czas</th>
                    <th>Barber</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appointment : ${appointments}">
                    <td th:text="${#temporals.format(appointment.startTime, 'dd.MM.yyyy')}"></td>
                    <td th:text="${#temporals.format(appointment.startTime, 'HH:mm')}"></td>
                    <td th:text="${appointment.service.name}"></td>
                    <td th:text="${appointment.service.price} + 'zł'"></td>
                    <td th:text="${appointment.service.durationMinutes} + 'min'"></td>
                    <td th:text="${appointment.barber.fullName}"></td>
                    <td th:text="${appointment.status}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="container-fluid my-4 dashboard-wide">
    <div class="booking-card">

        <div class="booking-head">
            <h1 style="text-align: center" class="booking-title">Wybierz usługę i date</h1>
        </div>

        <form method="get" th:action="@{/client/dashboard}" class="booking-form">
            <div class="booking-grid">

                <div class="booking-field">
                    <label class="pick-label">Usługa</label>
                    <select class="form-select booking-control" name="serviceId" required>
                        <option value="" disabled hidden th:selected="${selectedServiceId == null}">
                            Wybierz na jaką usługę chcesz się zapisać...
                        </option>
                        <option th:each="service : ${services}"
                                th:value="${service.id}"
                                th:selected="${service.id == selectedServiceId}"
                                th:text="${service.name + ' - ' + service.price + ' zł (' + service.durationMinutes + ' min)'}">
                        </option>
                    </select>
                </div>

                <div class="booking-field">
                    <label class="pick-label" for="dateInput">Data</label>
                    <input id="dateInput"
                           class="form-control booking-control"
                           type="date"
                           name="date"
                           th:value="${selectedDate != null ? #temporals.format(selectedDate, 'yyyy-MM-dd') : ''}">
                </div>

                <div class="booking-actions">
                    <button type="submit" class="btn btn-gold w-100">Pokaż wolne godziny</button>
                </div>

            </div>
        </form>

        <div class="alert booking-alert" th:if="${selectedServiceId != null and #lists.isEmpty(availableSlots)}">
            Brak wolnych terminów na ten dzień.
        </div>

        <div class="slots" th:if="${!#lists.isEmpty(availableSlots)}">
            <div style="text-align: center" class="slots-title">Dostępne godziny</div>

            <div class="slots-grid">
                <div class="slot" th:each="time : ${availableSlots}">
                    <div class="slot-time" th:text="${time}"></div>

                    <form method="post" th:action="@{/client/book}">
                        <input type="hidden" name="date" th:value="${selectedDate}">
                        <input type="hidden" name="time" th:value="${time}">
                        <input type="hidden" name="serviceId" th:value="${selectedServiceId}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <button type="submit" class="btn btn-ink btn-sm w-100">Zarezerwuj</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<div class="text-center mt-4">
    <a class="btn btn-outline-light" th:href="@{/}">Strona główna</a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
