<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Klienta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap"
          rel="stylesheet">
</head>
<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<h3>Wybierz datę i godzinę</h3>

<p th:if="${barberName}">Zapisujesz się do:
    <b th:text="${barberName}"></b>
</p>

<div th:if="${#lists.isEmpty(availableSlots)}">
    <p>Brak wolnych terminów na ten dzień.</p>
</div>

<form method="get" th:action="@{/client/dashboard}" class="mb-3">
    <label>Data:</label>
    <input type="date" name="date" th:value="${selectedDate}">

    <label class="mb-3">Usługa:</label>
    <select name="serviceId">
        <option th:each="service : ${services}"
                th:value="${service.id}"
                th:selected="${service.id == selectedServiceId}"
                th:text="${service.name + ' - ' + service.price + 'zł (' + service.durationMinutes} + 'min)'">
        </option>
    </select>

    <button type="submit" class="ms-2">Pokaż wolne godziny</button>
</form>

<ul th:if="${!#lists.isEmpty(availableSlots)}">
    <li th:each="time : ${availableSlots}">
        <span th:text="${time}"></span>

        <form method="post" th:action="@{/client/book}" style="display:inline">
            <input type="hidden" name="date" th:value="${selectedDate}">
            <input type="hidden" name="time" th:value="${time}">
            <input type="hidden" name="serviceId" th:value="${selectedServiceId}">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Zarezerwuj</button>
        </form>
    </li>
</ul>

<h3>Moje wizyty:</h3>

<div th:if="${#lists.isEmpty(appointments)}">
    <p>Nie masz jeszcze żadnych wizyt.</p>
</div>

<table th:if="${!#lists.isEmpty(appointments)}">
    <thead>
    <tr>
        <th>Data i godzina</th>
        <th>Usługa</th>
        <th>Koszt</th>
        <th>Czas</th>
        <th>Barber</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="appointment : ${appointments}">
        <td th:text="${#temporals.format(appointment.startTime, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${appointment.service.name}"></td>
        <td th:text="${appointment.service.price} + 'zł'"></td>
        <td th:text="${appointment.service.durationMinutes} + 'min'"></td>
        <td th:text="${appointment.barber.fullName}"></td>
    </tr>
    </tbody>
</table>

<a th:href="@{/}">Strona główna</a>

<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
