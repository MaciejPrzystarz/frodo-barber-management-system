<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo.jpg}">
    <title>Panel Admina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/flash :: flash}"></div>

<div class="container-fluid my-5 dashboard-wide">
    <div class="row g-4 align-items-stretch">

        <div class="col-xl-4 col-lg-4 col-md-12">
            <div class="dashboard-card">
                <h4 style="text-align: center">Lista wszystkich zarejestrowanych użytkowników</h4>
                <table class="table table-dark table-responsive" th:if="${!#lists.isEmpty(allUsers)}">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Imię Nazwisko</th>
                        <th>Numer telefonu</th>
                        <th>Email</th>
                        <th>Rola</th>
                        <th>Edycja</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${allUsers}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.fullName}"></td>
                        <td th:text="'+48 ' + ${user.phoneNumber}"></td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.role}"></td>
                        <td>
                            <a class="btn btn-sm btn-outline-warning"
                               th:href="@{/admin/users/{id}/edit(id=${user.id})}">Edytuj</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-xl-4 col-lg-4 col-md-12">
            <div class="dashboard-card">
                <h4 style="text-align: center">Lista wszystkich wizyt</h4>
                <table class="table table-dark table-responsive" th:if="${!#lists.isEmpty(allAppointments)}">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Client</th>
                        <th>Barber</th>
                        <th>Data</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="appointment : ${allAppointments}">
                        <td th:text="${appointment.id}"></td>
                        <td th:text="${appointment.client.fullName}"></td>
                        <td th:text="${appointment.barber.fullName}"></td>
                        <td th:text="${#temporals.format(appointment.startTime,'dd.MM.yyyy HH:mm')}"></td>
                        <td th:text="${appointment.status}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-xl-4 col-lg-4 col-md-12">
            <div class="dashboard-card">
                <h4 style="text-align: center">Lista wszystkich usług</h4>
                <table class="table table-dark table-responsive" th:if="${!#lists.isEmpty(allServices)}">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nazwa</th>
                        <th>cena</th>
                        <th>ilość minut</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="serviceItem : ${allServices}">
                        <td th:text="${serviceItem.id}"></td>
                        <td th:text="${serviceItem.name}"></td>
                        <td th:text="${serviceItem.price}"></td>
                        <td th:text="${serviceItem.durationMinutes}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="text-center mt-4">
    <a class="btn btn-outline-light" th:href="@{/}">Strona główna</a>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
