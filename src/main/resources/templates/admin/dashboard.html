<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap"
          rel="stylesheet">
</head>
<body>

<h3>Lista wszystkich zarejestrowanych użytkowników:</h3>
<div>
    <table th:if="${!#lists.isEmpty(allUsers)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Imie Nazwisko</th>
            <th>Numer telefonu</th>
            <th>Email</th>
            <th>Rola</th>
            <th>Edycja</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${allUsers}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.fullName}"></td>
            <td th:text="${user.phoneNumber}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td ><a class="btn btn-sm btn-outline-warning"
                    th:href="@{/admin/users/{id}/edit(id=${user.id})}">Edytuj</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<a th:href="@{/}">Strona główna</a>

</body>
</html>
