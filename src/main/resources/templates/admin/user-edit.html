<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edycja użytkownika – Frodo Barber')}"></head>

<body class="login-page">

<div class="login-shell">
    <section class="card-login">
        <h2 class="card-title">Edycja użytkownika</h2>

        <form th:action="@{/admin/users/edit}" method="post" class="mt-2" th:object="${userForm}">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label" for="fullName">Imię Nazwisko</label>
                <input id="fullName" type="text" class="form-control" placeholder="Jan Kowalski" th:field="*{fullName}">
                <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="phoneNumber">Numer telefonu</label>
                <input id="phoneNumber" type="text" class="form-control" placeholder="456789123" th:field="*{phoneNumber}">
                <div class="text-danger small" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">E-mail</label>
                <input id="email" type="text" class="form-control" placeholder="jan.kowalski@gmail.com" th:field="*{email}">
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Hasło</label>
                <input id="password" type="password" class="form-control" placeholder="Zmień na nowe hasło" th:field="*{newPassword}">
                <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-gold w-100">
                Edytuj
            </button>
        </form>

    </section>
</div>

</body>
</html>
