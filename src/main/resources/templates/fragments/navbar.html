<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <div class="logo">
                <img th:src="@{/images/logo-white.jpg}" alt="logo" class="img-fluid rounded shadow">
            </div>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link btn btn-outline-light ms-lg-3 nav-hover" th:href="@{/admin/dashboard}">Panel
                        Admina</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('BARBER')">
                    <a class="nav-link btn btn-outline-light ms-lg-3 nav-hover" th:href="@{/barber/dashboard}">Panel
                        Barbera</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('CLIENT')">
                    <a class="nav-link btn btn-outline-light ms-lg-3 nav-hover" th:href="@{/client/dashboard}">Umów
                        wizytę</a>
                </li>

                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link btn btn-outline-light ms-lg-3 nav-hover" th:href="@{/login}">Zaloguj się</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="nav-link btn btn-outline-light ms-lg-3 nav-hover">Wyloguj</button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>
